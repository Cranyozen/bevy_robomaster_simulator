[workspace]
members = [".", "crates/*"]
resolver = "2"

[workspace.dependencies]
bevy = { version = "0.19", features = ["dynamic_linking", "jpeg"] }
avian3d = "0.7"
bevy-inspector-egui = "0.37"
memmap2 = { version = "0" }

[package]
name = "daedalus"
version = "0.1.0"
edition = "2024"
default-run = "daedalus"

[features]
ros2 = ["dep:r2r"]
# Benchmark v2. `bench` is strictly additive on top of `ros2`: it needs the node,
# the `/tf` clock and `r2r`'s generated `Sim*` bindings, and a plain `ros2` build
# must stay byte-for-byte the v1 measurement surface. Because it is an ordinary
# cargo feature (not a runtime flag), anything `bench`-only lives behind
# `#[cfg(feature = "bench")]` and the default build is untouched.
bench = ["ros2"]
talos = ["dep:talos-ipc"]
ffmpeg = ["dep:ffmpeg-next"]
default = ["talos"]

[dependencies]
bevy = { workspace = true }
avian3d = { workspace = true }
bevy-inspector-egui = { workspace = true }
rand = "0.10"
r2r = { version = "0", optional = true }
talos-ipc = { path = "crates/talos-ipc", optional = true }
crossbeam-channel = "0"
image = "0"
egui = "0"
futures = "0"
exact = { path = "crates/exact" }
bevy_metalfx = { path = "crates/bevy_metalfx" }
toml = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
ffmpeg-next = { version = "8.1.0", optional = true }

[[bin]]
name = "talos_gimbal_mock_server"
path = "src/bin/talos_gimbal_mock_server.rs"
required-features = ["talos", "ffmpeg"]

[patch.crates-io]
r2r_msg_gen = { path = "third_party/r2r_msg_gen" }

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
