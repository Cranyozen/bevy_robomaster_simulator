# Bevy RoboMaster Simulator Configuration

[window]
# Rendering present mode. Use `auto_no_vsync` to exceed 60Hz for Talos/ROS2 capture.
# Options: auto_vsync, auto_no_vsync, fifo, fifo_relaxed, mailbox, immediate
present_mode = "auto_no_vsync"

[performance]
# Frame rate cap for the main loop. 0 = uncapped (what Talos/ROS2 capture wants);
# a positive value sleeps out the rest of each frame, so it only bites when
# present_mode is not already vsync-limited. Clamped to 1..=1000.
max_fps = 0
# Upper bound on a single frame's delta, in seconds. 0 = engine default (0.25s).
# This is the hitch guard: after a stall, gameplay sees at most this dt, and since
# the fixed step is driven by virtual time it also caps the fixed steps one frame
# may run (max_frame_delta * physics.fixed_hz), which is what keeps a slow frame
# from snowballing into an ever-longer physics catch-up. Clamped to 0.001..=5.0.
max_frame_delta = 0.0

[debug]
# Turn these on only when needed; they noticeably reduce FPS.
egui = false
inspector = false
# Prints FPS/frametime diagnostics to console.
diagnostics = true

[preview]
# On-screen preview camera. Disable to avoid rendering the scene twice (preview + capture).
enabled = true

[render]
# Expensive on large scenes; disable for higher FPS.
shadows = true
# Main on-screen camera anti-aliasing.
main_camera_fxaa = true
# Enables Apple's MetalFX temporal scaler for color 3D cameras on macOS.
metalfx_temporal = true
# Enables MetalFX frame interpolation after temporal upscaling.
# Needs macOS 26 or newer; ignored (with a log line) elsewhere.
metalfx_frame_generation = false
# Output/render resolution ratio used by MetalFX temporal upscaling. Clamped to 1.0..=3.0.
metalfx_scale = 2.0
illuminance = 500.0
# Far plane of the main and capture cameras, in meters. 0 = built-in values
# (main camera 5e8 m, capture camera 10 km). Setting e.g. 300 culls distant
# scenery early and sharpens depth precision; the inset camera keeps its own
# `camera.pip_far`, and the depth camera keeps `capture.depth.far`.
view_distance = 0.0
# Far bound of the shadow cascades, in meters. 0 = engine default (150 m).
# Shrinking it is the cheapest way to make shadows affordable. Clamped to 1..=10000.
shadow_max_distance = 0.0
# Shadow cascade count, clamped to 1..=4. 0 = engine default (4).
# Fewer cascades = fewer shadow passes, at the cost of blockier near shadows.
shadow_cascades = 0
[capture.color]
# RGB capture resolution for existing camera pipeline. This also sizes the
# on-screen preview, so it is the "how good does the sim look" knob; what the
# auto-aim stack receives is `scale` below.
width = 1440
height = 1080

# --- image transport budget (ROS 2 only) --------------------------------------
# Measured on this machine (AMD iGPU), control-loop input rate = /tracker/target:
#
#   raw 1440x1080, every frame   ->  6.9 Hz,  25 MB/s, sim 20 fps
#   raw 1440x1080, 30 Hz, 3 deep -> 11.1 Hz,  48 MB/s, sim 13 fps
#   JPEG 1440x1080,  30 Hz       ->  4.7 Hz, 0.5 MB/s, sim 60 fps
#   JPEG 720x540,    30 Hz, 3 deep -> 15.9 Hz, 0.3 MB/s, sim 30 fps   <- shipped
#
# The binding constraints are the GPU readback (~100 ms per frame, which is why
# `max_in_flight` matters) and `image`'s scalar JPEG encoder (21 Mpix/s: ~190 ms
# for a full-resolution frame). DDS itself is not a limit here — a synthetic
# publisher pushed 221 MB/s through it. Prefer raw over JPEG only if you need the
# full capture resolution; expect ~11 Hz and ~50 MB/s.

# Upper bound on the image publish rate, in Hz. 0 = every captured frame.
# Frames that are skipped are dropped *before* the GPU readback, so they cost
# nothing (no copy, no conversion, no encode).
publish_hz = 30.0
# How many captures may be in flight at once, 1..=8. A readback waits ~100 ms for
# `map_async` to land on a later device poll while costing almost no CPU, so 1
# slot caps the stream at ~6 Hz whatever else is set. 3 buys ~2.5x and costs up
# to one frame of extra latency.
max_in_flight = 3
# Upper bound on the `/camera_info` publish rate, in Hz. The intrinsics only
# change when the resolution does and the detector latches the first message.
camera_info_hz = 1.0
# Publish JPEG on `/image_raw/compressed` (sensor_msgs/CompressedImage).
publish_compressed = true
# Publish raw rgb8 on `/image_raw` as well. Off by default: 4.66 MB per frame at
# the capture resolution. Turn it on only for a consumer that cannot decode
# compressed images, and expect the rate above.
publish_raw = false
# JPEG quality, 1..=100. Lower is cheaper on the CPU and the wire.
jpeg_quality = 80
# Downscale before publishing, 0.1..=1.0. `/camera_info` is scaled to match, so
# PnP stays correct. This is the rate-vs-detail dial: 0.5 roughly halves the JPEG
# encoder's work per frame and 4x-cuts the readback, which is worth ~1.5x more
# images per second (see the table above). A half-size image is still ~29 px of
# armor at 3 m; set 1.0 when you need long-range detection more than rate.
scale = 0.5

[capture.depth]
# Depth capture resolution for livox-compatible point cloud output.
width = 1280
height = 720
near = 0.1
far = 80.0

[livox_ros]
enabled = true
frame_id = "camera_link"
publish_freq = 10.0
points_per_second = 400000
line_num = 20
tag_default = 0
intensity_default = 1000.0

[physics]
fixed_hz = 120.0                # fixed physics ticks per second
substep_count = 8               # physics substeps per fixed tick

[vehicle]
rotation_speed = 7.42            # rad/s - chassis rotation speed
yaw_acceleration = 20.0          # rad/s^2 - constant yaw acceleration (quadratic yaw curve)
tilt_rotation_speed = 3.0        # rad/s - chassis roll/pitch swing speed
gimbal_rotation_speed = 3.0     # rad/s - gimbal rotation speed
gimbal_pitch_limit = 0.785      # rad - gimbal pitch limit (~45 degrees)
max_speed = 6.0                 # m/s - maximum vehicle speed
linear_acceleration = 6.0       # m/s^2 - linear acceleration
acceleration_exponent = 2.5    # exponent for non-linear acceleration curve

# Closed-loop tracking of external auto-aim (Talos/ROS2) gimbal commands.
# Yaw and pitch are independent loops with independent gains.
#
# TUNING NOTE: these were kp = 50.0 / max_rate = 100.0 (rad/s), which is
# unstable. This is a *discrete* proportional rate loop, so the angle advances by
# roughly `kp * error * dt` each frame; it only stays stable while `kp * dt < 2`.
# The render loop runs at a variable 8-55 fps here, so dt reaches ~0.125 s and
# kp * dt hit 6.25 -- the gimbal then oscillates at ~1.25 Hz and swings through
# tens of degrees per frame. It looked stable only when the error was ~0 (i.e.
# parked at the default pose), which is why "stable" and "can see the enemy"
# appeared to be mutually exclusive.
#
# kp = 6.0 keeps kp * dt <= 0.75 even at 8 fps, with a little derivative damping.
[vehicle.gimbal_pid.yaw]
kp = 6.0
ki = 0.0
kd = 0.05
integral_limit = 0.5            # rad*s - anti-windup bound on the integral term
max_rate = 8.0                  # rad/s - saturation of the commanded yaw rate

[vehicle.gimbal_pid.pitch]
kp = 6.0
ki = 0.0
kd = 0.05
integral_limit = 0.5            # rad*s - anti-windup bound on the integral term
max_rate = 8.0                  # rad/s - saturation of the commanded pitch rate

[mecanum]
wheel_radius_m = 0.076          # wheel radius (m)
half_wheelbase_m = 0.18         # half of front-rear wheel spacing (m)
half_trackwidth_m = 0.15        # half of left-right wheel spacing (m)

[projectile]
lifetime = 5.0                  # seconds - projectile lifetime
speed = 25.0                    # m/s - initial speed
cooldown = 0.05                  # seconds - fire cooldown
diameter = 0.017                # meters - projectile diameter (17mm)
mass = 0.0032                    # kg - projectile mass (17g)
friction = 1.1                  # friction coefficient
linear_damping = 0.0            # linear damping (set to 0 for physics-based drag below)
uav_vel = 5.0
uav_size = 0.5
[projectile.aerodynamics]
enabled = false                  # enable aerodynamic forces
air_density = 1.225             # kg/m^3 - air density at sea level
drag_coefficient = 0.22516         # Cd - smooth sphere drag coefficient
wind = [0.0, 0.0, 0.0]          # m/s - wind velocity in world coordinates

[camera]
fov = 45.0                      # degrees - field of view
free_move_speed = 8.0           # m/s - free camera movement speed
follow_offset = [0.0, 3.0, 2.0] # third-person follow camera offset
mouse_sensitivity = 0.003       # mouse look sensitivity

# Third-person inset in the bottom-right corner, shown while the main view is
# first-person. `F6` (gamepad B) toggles it at runtime; `pip_enabled` is the
# master switch. It costs one extra scene render while visible, so it refreshes
# every `pip_refresh_divisor` frames and culls beyond `pip_far`.
pip_enabled = true              # master switch for the inset
pip_size = [320.0, 180.0]       # px - inset render target size (restart required)
pip_offset = [0.0, 1.0, 4.5]    # [lateral, up, behind] - boom against the gimbal's horizontal aim
pip_margin = 16.0               # px - distance from the bottom-right corner
pip_opacity = 0.8               # 0.0..=1.0 - inset opacity
pip_refresh_divisor = 2         # render the inset every N frames (1 = every frame)
pip_far = 60.0                  # m - inset camera far plane (culls distant scenery)
